name: check

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: florence_test
          POSTGRES_PASSWORD: florence
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d florence_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:florence@127.0.0.1:5432/florence_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          NODE_ENV: test
          FLORENCE_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm check
      - run: docker build --tag florence:${{ github.sha }} .
