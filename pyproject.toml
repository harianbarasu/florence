[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "florence"
version = "0.1.0"
description = "A text-first household assistant for busy parents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
florence = "florence.__main__:main"
florence-worker = "florence.worker:main"

[tool.setuptools.packages.find]
include = ["florence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
