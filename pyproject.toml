[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "florence"
version = "2.0.0"
description = "Florence: a family assistant that lives in the family's iMessage thread."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=4,<7",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.6,<1"]

[project.scripts]
florence = "florence.__main__:main"

[tool.setuptools.packages.find]
include = ["florence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
