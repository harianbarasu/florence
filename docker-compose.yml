services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: florence
      POSTGRES_USER: florence
      POSTGRES_PASSWORD: florence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - florence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florence -d florence"]
      interval: 2s
      timeout: 2s
      retries: 20
    stop_grace_period: 30s

volumes:
  florence_postgres_data:
