services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: florence
      POSTGRES_PASSWORD: florence
      POSTGRES_DB: florence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florence"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      FLORENCE_DATABASE_URL: postgresql://florence:florence@db:5432/florence
    ports:
      - "8000:8000"

volumes:
  pgdata:
